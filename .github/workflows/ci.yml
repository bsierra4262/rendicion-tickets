name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    name: Tests de regresión (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, curl
          coverage: none
          tools: none

      - name: Lint PHP (sintaxis)
        run: find app test -name '*.php' -print0 | xargs -0 -n1 -P4 php -l > /dev/null

      - name: Correr tests
        run: php test/run_tests.php
