<VirtualHost *:80>
    DocumentRoot /var/www/html/app/web
    DirectoryIndex index.php

    <Directory /var/www/html/app/web>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted

        RewriteEngine On
        # Servir archivos y carpetas reales tal cual (assets, modelos, etc.)
        RewriteCond %{REQUEST_FILENAME} -f [OR]
        RewriteCond %{REQUEST_FILENAME} -d
        RewriteRule ^ - [L]
        # Todo lo demás → front controller
        RewriteRule ^([A-Za-z0-9/_-]*)$ index.php?r=$1 [L,QSA]
    </Directory>

    # El código de la app se incluye del lado del servidor; nunca se sirve directo.
    <Directory /var/www/html/app/web/app>
        Require all denied
    </Directory>

    # Nunca servir fuentes/artefactos sensibles.
    <FilesMatch "\.(sql|md|json|lock|log|sh|dist|example)$">
        Require all denied
    </FilesMatch>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
