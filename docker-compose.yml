# ============================================================
#  Rendición de Tickets — stack de desarrollo/despliegue con Docker
#  Uso:  cp .env.example .env  (editá los valores)  &&  docker compose up -d
#  App:  http://localhost:8080
# ============================================================
services:
  app:
    build: .
    ports:
      - "${APP_PORT:-8080}:80"
    env_file: .env
    depends_on:
      - db
    volumes:
      - storage:/var/www/storage
    restart: unless-stopped

  db:
    image: mariadb:10.11
    environment:
      MARIADB_DATABASE: "${DB_NAME:-tickets}"
      MARIADB_USER: "${DB_USER:-tickets}"
      MARIADB_PASSWORD: "${DB_PASS:-tickets}"
      MARIADB_ROOT_PASSWORD: "${DB_ROOT_PASS:-root}"
    volumes:
      - dbdata:/var/lib/mysql
    restart: unless-stopped

volumes:
  storage:
  dbdata:
